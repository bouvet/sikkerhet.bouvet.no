[promo_title]
other = "Promoting an artefact through the environments"

[promo_desc]
other = "The same artefact is rolled out to dev, then to test and finally to production. Deploying to test requires an approval, and deploying to production requires four-eyes approval."

[promo_caption]
other = "The same artefact is promoted between environments with no rebuild along the way. The approvals between each step are what separate a promotion from a fresh deployment — it is the same code already verified in the environment before."

