[gittrunk_title]
other = "Trunk-based branching"

[gittrunk_desc]
other = "The production branch runs horizontally through the figure. Feature branches split off from it, take a few commits each, and are merged back into the production branch. Several feature branches are in progress at once, but everything ends up in the same branch."

[gittrunk_caption]
other = "Trunk-based branching. The production branch is protected, and all code arrives through feature branches that are merged back after review. It is the simplest model that still gives you control over what reaches production."

[gitadv_title]
other = "Branching with separate environment branches"

[gitadv_desc]
other = "Five lanes sit above each other: feature, develop, test, prod and hotfix. Developers work in feature branches that are merged into develop, which deploys to the dev environment. Each version is tagged on develop and becomes the basis for a test branch, which deploys to the test environment and on to prod. A hotfix splits off from prod, is fixed and merged back into prod, and is additionally picked over to develop along the dashed line."

[gitadv_caption]
other = "Branching with a separate branch per environment and tagged versions. Useful when several versions live in different environments at once, or when you have to fix something in production without dragging along everything sitting in develop. The dashed line is the hotfix picked back to develop, so the fix does not disappear at the next release."

[pipe_title]
other = "CI/CD flow from code change to production"

[pipe_desc]
other = "The developer commits changes from the dev environment to version control. From there the developer starts the CI/CD run, which builds the artefact on a build agent. The build agent deploys to the dev environment, the dev environment on to test, and going from test to production requires an approval first."

[pipe_caption]
other = "The CI/CD flow from code change to production. The same artefact travels the whole way, and the stopping point before production is deliberate: every run should be traceable, repeatable and approved before it reaches end users."

