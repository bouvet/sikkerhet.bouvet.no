[gittrunk_title]
other = "Trunk-based branching"

[gittrunk_desc]
other = "Produksjonsbranchen går vannrett gjennom figuren. Feature-brancher greiner ut fra den, får noen commits hver, og merges tilbake inn i produksjonsbranchen. Flere feature-brancher er i arbeid samtidig, men alt ender i den samme branchen."

[gittrunk_caption]
other = "Trunk-based branching. Produksjonsbranchen er beskyttet, og all kode kommer inn via feature-brancher som merges tilbake etter review. Det er den enkleste modellen som fortsatt gir deg kontroll på hva som havner i produksjon."

[gitadv_title]
other = "Branching med egne miljøbrancher"

[gitadv_desc]
other = "Fem baner ligger over hverandre: feature, develop, test, prod og hotfix. Utviklerne jobber i feature-brancher som merges inn i develop, som deployes til dev-miljøet. Hver versjon tagges på develop og blir grunnlaget for en testbranch, som deployes til testmiljøet og videre til prod. En hotfix greiner ut fra prod, rettes og merges tilbake til prod, og plukkes i tillegg over til develop med den stiplede linja."

[gitadv_caption]
other = "Branching med egne brancher per miljø og tagging av versjoner. Nyttig når flere versjoner lever i ulike miljø samtidig, eller når du må kunne rette noe i produksjon uten å dra med deg alt som ligger i develop. Den stiplede linja er hotfixen plukket tilbake til develop, slik at rettelsen ikke forsvinner ved neste release."

[pipe_title]
other = "CI/CD-flyt fra kodeendring til produksjon"

[pipe_desc]
other = "Utvikleren committer endringer fra utviklingsmiljøet til versjonskontrollen. Derfra starter utvikleren CI/CD-kjøringen, som bygger artefaktet på en byggeagent. Byggeagenten deployer til dev-miljøet, dev-miljøet videre til test, og fra test til produksjon kreves en godkjenning først."

[pipe_caption]
other = "CI/CD-flyten fra kodeendring til produksjon. Det samme artefaktet følger hele veien, og stoppunktet før produksjon er bevisst: hver kjøring skal kunne spores, gjentas og godkjennes før den når sluttbrukerne."

