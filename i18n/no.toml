[promo_title]
other = "Promotering av artefakt gjennom miljøene"

[promo_desc]
other = "Det samme artefaktet rulles ut til dev, så til test og til slutt til produksjon. Før utrulling til test kreves en godkjenning, og før utrulling til produksjon kreves godkjenning fra fire øyne."

[promo_caption]
other = "Samme artefakt promoteres mellom miljøene uten ny bygging underveis. Godkjenningene mellom hvert steg er det som skiller en promotering fra en ny utrulling — det er den samme koden som allerede er verifisert i miljøet før."

