[iam_title]
other = "IAM-diagram for et utviklingsmiljø"

[iam_desc]
other = "Til venstre ligger identitetene i Entra ID: en tjenesteprinsipal for Azure DevOps, de administrerte identitetene til Backend og ingest-factory, en utvikler og en applikasjonsbruker. Til høyre ligger Dev Subscription med ressursene backend-dev-sql01, dev-keyvault og ressursgruppene Backend og Frontend, samt production-sql-01 som står på egen maskinpark utenfor abonnementet. Tjenesteprinsipalen er Owner på abonnementet og utvikleren Contributor. Utvikleren er i tillegg Key Vault Secrets Officer på dev-keyvault og SQL Admin på både backend-dev-sql01 og production-sql-01. De administrerte identitetene er Key Vault Secrets User på dev-keyvault og db_datareader på backend-dev-sql01. Applikasjonsbrukeren har en brukerrolle på Frontend."

[iam_entra_sub]
other = "Brukere og tjenesteprinsipaler"

[iam_caption]
other = "Eksempel på IAM-diagram. Identitetene står til venstre, omfangene til høyre, og hver pil er én rolletildeling med rollenavnet påskrevet. Piler som ender på kanten av abonnementsboksen er tildelt på abonnementsnivå og arves ned til alt som ligger i det; piler som ender på en ressurs gjelder bare den ressursen. Poenget er at ingen tilgang står udokumentert."

[netdiag_caption]
other = "Eksempel på nettverksdiagram for et utviklingsmiljø. Hvert subnett er navngitt med adresseområdet sitt, hver ressurs har sin egen adresse, og pilene viser retningen på trafikken og hvilken port som er åpnet. Rapportområdet når backend-API-et gjennom samme WAF som frontenden. Den stiplede boksen er en avhengighet utenfor teamets eget miljø."

[dataflow_p2]
other = "Oppdaterer sammendraget"

[dataflow_p4]
other = "Henter data fra datasjøen"

[dataflow_title]
other = "Dataflytdiagram for et utviklingsmiljø"

[dataflow_desc]
other = "Dataene kommer fra to kilder: databasen production-sql-01 på egen maskinpark, der tre views er i bruk, og containeren datalake-somedata-prod01 i bedriftens dataplattform. Begge lastes inn av ingest-factory-dev-01, som kjører fire pipelines. Derfra skrives dataene til skjemaene CurrentData og HistoricalData i backend-dev-sql01. HistoricalData leses av Report01 og Report02 i dev-workspace, CurrentData av Report03."

[dataflow_caption]
other = "Eksempel på dataflytdiagram. Det følger dataene fra kilde til rapport, og navngir hvilke views, pipelines og skjemaer som faktisk er i bruk i hvert steg. Det er den navngivingen som gjør diagrammet brukbart når et avvik skal spores tilbake."
