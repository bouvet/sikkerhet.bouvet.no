[netdiag_title]
other = "Nettverksdiagram for et utviklingsmiljø"

[netdiag_desc]
other = "En intern bruker når en Azure Firewall over HTTPS 443. Brannmuren slipper trafikk videre til subnettet Frontend-dev (10.0.0.0/27), som inneholder en app service og en key vault, og til rapportområdet Dev workspace med to rapporter. Begge går videre til en Azure WAF, som slipper trafikken inn i subnettet Backend-dev (10.0.0.32/27). Der ligger to app services og en ingress-factory, som alle bruker den samme SQL-databasen og key vaulten. Ingress-factory henter data fra datasjøen datalake-somedata-prod01 i bedriftens dataplattform, som ligger utenfor miljøet."


