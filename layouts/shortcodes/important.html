{{- /* The label is the author's own `title` when there is one; `note_important`
       is only a fallback. See tip.html. */ -}}
{{- $label := .Get "title" | default (T "note_important") -}}
<div class="sb-note sb-note--important" role="note">
  {{ partial "icon.html" "triangle-alert" -}}
  <span class="sb-note__label">{{ $label }}</span>
  <div class="sb-note__body">
    {{ .Inner | .Page.RenderString (dict "display" "block") }}
  </div>
</div>
