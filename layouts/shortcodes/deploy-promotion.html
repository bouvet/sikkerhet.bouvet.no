{{- /* Promotering av samme artefakt gjennom miljøene, med godkjenningen som
       kreves før hvert hopp. Tegnet som inline SVG i stedet for en bildefil.

       Miljøfargene er de samme som i gitgrafene og i `pipeline-flow`.

       {{< deploy-promotion >}} */ -}}
{{- $m := printf "dp-%d" .Ordinal -}}
<figure class="sb-diagram">
  <div class="sb-diagram__scroll">
    <svg viewBox="0 0 970 120" style="--sbd-min: 700px"
         role="img" aria-labelledby="{{ $m }}-t {{ $m }}-d">
      <title id="{{ $m }}-t">{{ T "promo_title" }}</title>
      <desc id="{{ $m }}-d">{{ T "promo_desc" }}</desc>
      <defs>
        <marker id="{{ $m }}" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path class="sbd-arrow" d="M0 0 L10 5 L0 10 z" />
        </marker>
      </defs>

      <rect class="sbd-box sbd-box--miljo" style="--sbd-c: var(--sbd-gren-2)"
            x="20" y="30" width="190" height="60" />
      <text class="sbd-name" x="115" y="65">{{ T "promo_dev" }}</text>

      <path class="sbd-line" marker-end="url(#{{ $m }})" d="M210 60 H370" />
      <text class="sbd-edge" x="217" y="52">{{ T "promo_gate1" }}</text>

      <rect class="sbd-box sbd-box--miljo" style="--sbd-c: var(--sbd-gren-3)"
            x="370" y="30" width="190" height="60" />
      <text class="sbd-name" x="465" y="65">{{ T "promo_test" }}</text>

      <path class="sbd-line" marker-end="url(#{{ $m }})" d="M560 60 H760" />
      <text class="sbd-edge" x="564" y="52">{{ T "promo_gate2" }}</text>

      <rect class="sbd-box sbd-box--miljo" style="--sbd-c: var(--sbd-gren-4)"
            x="760" y="30" width="190" height="60" />
      <text class="sbd-name" x="855" y="65">{{ T "promo_prod" }}</text>
    </svg>
  </div>
  <figcaption>{{ T "promo_caption" }}</figcaption>
</figure>
