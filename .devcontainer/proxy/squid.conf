# Squid egress-gate: filtrerer på destinasjonsnavn uten å dekryptere – ingen
# MITM, ingen egen CA. Navnet sjekkes to steder: CONNECT-målet (http_access) og
# SNI-et i klientens TLS ClientHello (ssl_bump peek/splice). Delte CDN-edger
# ruter på SNI, så uten SNI-sjekken slipper enhver CDN-kunde gjennom en
# allowlistet vert. Krever OpenSSL-bygd Squid (images/proxy). Se README
# «Utgående nett».

# Lytteadressene skrives av entrypointet ved start: kun det interne nettets IP
# og loopback, aldri egress-siden (K-NET-5). Portene har ssl-bump for å lese
# ClientHello; tls-cert er et dummy-cert per start som aldri presenteres.
#   http_port <intern-ip>:3128 ssl-bump tls-cert=/run/squid/dummy.pem generate-host-certificates=off
include /run/squid/listen.conf
pid_filename none

# Kun klienter fra private nett (Podman-nettet) og loopback (healthcheck).
acl localnet src 127.0.0.0/8
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

# -n: match kun strengen, ingen reverse-DNS av IP-literaler.
acl allowed_domains dstdomain -n "/etc/squid/allowed-domains.txt"

# Kun HTTPS (CONNECT/443) – klartekst HTTP er bevisst stengt; alle legitime
# klienter (npm/pip/NuGet/Claude/VS Code) bruker HTTPS.
acl SSL_ports port 443
acl CONNECT method CONNECT

# Regler – rekkefølgen betyr alt: første treff vinner.
http_access deny !localnet
http_access allow CONNECT allowed_domains SSL_ports
# Nektede CONNECT får TCP-reset, ikke feilside: med ssl-bump på porten ville
# Squid ellers bumpe forbindelsen og servere 403 over TLS med dummy-certet, og
# klienten ser en sertifikatfeil. Klartekst HTTP får fortsatt ren 403.
http_access deny CONNECT
deny_info TCP_RESET CONNECT
http_access deny all

# SNI-sjekk: peek på ClientHello, splice når navnet klienten ber om (SNI, eller
# CONNECT-verten når SNI mangler) står på lista, terminer ellers.
acl step1 at_step SslBump1
acl sni_allowed ssl::server_name --client-requested "/etc/squid/allowed-domains.txt"
ssl_bump peek step1
ssl_bump splice sni_allowed
ssl_bump terminate all

# Egress-gate, ikke cache. Logg til stdout/stderr (podman logs; reset.sh lagrer).
cache deny all
cache_mem 8 MB
pinger_enable off
shutdown_lifetime 2 seconds
access_log stdio:/dev/stdout squid
cache_log /dev/stderr

# Ikke lekk klient-IP eller Squid-versjon videre.
forwarded_for delete
via off
httpd_suppress_version_string on
